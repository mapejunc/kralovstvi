<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slovní království</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: široká pixel-art scéna království nahoře (posouvá se do stran), pod ní úzký sloupec s hádáním slov.
   Vzhled je záměrně jen tmavý: večerní fialová, dřevo a zlato z předlohy. */
:root{
  --night:#1d1626; --night-2:#2a2034; --edge:#0f0a15; --edge-hi:#46385a;
  --wood:#4a3224; --wood-hi:#6b4a33;
  --parch:#efe3cc; --parch-dim:#b7a98f;
  --banner:#7a4cb8; --banner-hi:#b48ae0; --gold:#e0b050; --ok:#5d9e47; --miss:#3a2f45;
  --font:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--night); color:var(--parch); font-family:var(--font); font-size:16px; line-height:1.45; margin:0;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font-family:inherit}
.page{max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.top{display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-end; justify-content:space-between}
h1{font-size:clamp(28px,7vw,40px); line-height:1.05; margin:0; font-weight:700; letter-spacing:.01em; text-wrap:balance}
.tag{margin:6px 0 0; color:var(--parch-dim); max-width:46ch}
.stats{display:flex; gap:10px}
.stat{background:var(--night-2); box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge); padding:8px 14px; display:flex; flex-direction:column; gap:2px; min-width:92px}
.stat b{font-size:26px; line-height:1; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--parch-dim)}
.stat.gold b{color:var(--gold)}
.stat.has{box-shadow:0 0 0 2px var(--gold), 0 3px 0 2px var(--edge)}

.stage-head{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin-bottom:10px}
.tabs{display:flex; gap:8px; flex-wrap:wrap}
.tab{color:var(--parch); background:var(--night-2); border:0; padding:8px 14px; font-size:16px; cursor:pointer; box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge)}
.tab small{margin-left:8px; color:var(--parch-dim); font-size:14px; font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--banner)}
.tab[aria-selected="true"] small{color:#e6d9f7}
.tab:disabled{opacity:.5; cursor:not-allowed}
.prog{color:var(--parch-dim); font-size:14px}
.stage{aspect-ratio:1; overflow-y:auto; overflow-x:hidden; background:#000; box-shadow:0 0 0 3px var(--edge); max-width:540px; margin:0 auto; scrollbar-width:thin; scrollbar-color:var(--wood-hi) var(--edge)}
.stage-in{position:relative; width:100%}
#scene{display:block; position:sticky; top:0; width:100%; height:auto; image-rendering:pixelated}
.panel{margin-top:12px; background:var(--night-2); box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge); padding:14px 16px; min-height:96px; display:flex; flex-direction:column; gap:12px}
.panel p{margin:0}
.pgrid{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pb{background:#1a1324; padding:12px 14px; box-shadow:0 0 0 2px var(--edge); display:flex; flex-direction:column; gap:6px}
.pb b{font-size:18px}
.panel .lead{color:var(--parch-dim)}
.up{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; background:var(--wood); padding:12px 14px; box-shadow:0 0 0 2px var(--edge)}
.up b{font-size:18px}
.info b{font-size:20px}
.picks{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x proximity; scrollbar-color:var(--wood-hi) var(--edge)}
.pick{flex:0 0 auto; scroll-snap-align:start; width:100px; padding:8px 8px 10px; background:var(--wood); color:var(--parch); border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge)}
.pick:hover{background:var(--wood-hi)}
.pick:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.pick canvas{width:84px; height:156px; image-rendering:pixelated; display:block}
.pick span{font-size:14px; font-weight:600; text-align:center; line-height:1.15}

.btn{background:var(--banner); color:#fff; border:0; padding:10px 18px; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 0 0 2px var(--edge), 0 4px 0 2px var(--edge)}
.btn:hover{background:#8a5cc8}
.btn:active{transform:translateY(2px); box-shadow:0 0 0 2px var(--edge), 0 2px 0 2px var(--edge)}
.btn:focus-visible,.key:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.btn.ghost{background:var(--wood)}
.btn.ghost:hover{background:var(--wood-hi)}

.game{width:100%; max-width:520px; margin:0 auto}
.game h2{font-size:24px; margin:0 0 2px; line-height:1.1}
.meta{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; color:var(--parch-dim); font-size:14px}
.board{display:grid; gap:6px; max-width:340px; margin:16px auto 8px}
.row{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.tile{aspect-ratio:1; display:grid; place-items:center; font-size:clamp(24px,8vw,34px); font-weight:700; background:var(--night-2); box-shadow:0 0 0 2px var(--edge-hi); user-select:none}
.tile.filled{box-shadow:0 0 0 2px var(--parch-dim); animation:pop .1s ease-out}
.tile.c{background:var(--ok); color:#fff; box-shadow:0 0 0 2px #3c6b2e, inset 0 -4px 0 rgba(0,0,0,.25)}
.tile.p{background:var(--gold); color:#2a1d10; box-shadow:0 0 0 2px #a8812e, inset 0 -4px 0 rgba(0,0,0,.2)}
.tile.x{background:var(--miss); color:var(--parch-dim); box-shadow:0 0 0 2px #2c2336}
.tile.flipping{animation:flip .5s ease-in-out}
.row.shake{animation:shake .4s}
@keyframes pop{from{transform:scale(.88)} to{transform:scale(1)}}
@keyframes flip{0%{transform:scaleY(1)} 50%{transform:scaleY(0)} 100%{transform:scaleY(1)}}
@keyframes shake{20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}}
.msg{min-height:26px; text-align:center; color:var(--gold); font-weight:600; margin-bottom:4px}
.result{background:var(--night-2); box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge); padding:14px 16px; margin:4px 0 16px; display:flex; flex-direction:column; gap:10px}
.result p{margin:0}
.result .rt{font-size:20px; font-weight:700}
.answer{color:var(--gold); letter-spacing:.12em}
.acts{display:flex; flex-wrap:wrap; gap:10px}
.cd{color:var(--parch-dim); font-size:14px}
.cd b{color:var(--parch); font-variant-numeric:tabular-nums}
.kb{display:grid; gap:6px}
.kr{display:flex; gap:5px; justify-content:center}
.key{flex:1 1 0; min-width:0; height:50px; background:#4b3c5e; color:var(--parch); border:0; font-size:17px; font-weight:600; cursor:pointer; text-transform:uppercase; touch-action:manipulation; box-shadow:0 3px 0 var(--edge)}
.key.wide{flex:1.7 1 0; font-size:12px; text-transform:none; letter-spacing:.02em}
.key.c{background:var(--ok); color:#fff}
.key.p{background:var(--gold); color:#2a1d10}
.key.x{background:#241c2d; color:#6f6380}
.key:active{transform:translateY(2px); box-shadow:0 1px 0 var(--edge)}
.foot{text-align:center; color:var(--parch-dim); font-size:13px; max-width:60ch; margin:0 auto}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

<style>
body{background:radial-gradient(ellipse at 50% -10%,#4b2f6e 0,#2a1d3f 38%,#150f1e 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 1.5px),radial-gradient(#f2c14e88 1px,transparent 1.5px);background-size:90px 90px,140px 140px;background-position:0 0,40px 55px;opacity:.35}
.page{position:relative}
h1{background:linear-gradient(#fff3c4,#e0b050 55%,#a8742a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0f0a15)}
.stat{background:linear-gradient(#34283f,#2a2034)}
.stage{box-shadow:0 0 0 3px #e0b050,0 0 0 6px var(--edge),0 18px 40px #0009}
.panel{background:linear-gradient(#2e2340,#241b32)}
.game{background:linear-gradient(#2e2340,#221a30);padding:20px 18px 22px;box-shadow:0 0 0 2px var(--edge),0 0 0 4px var(--edge-hi),0 14px 30px #0008}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.gform{display:flex;gap:8px;margin:14px 0 6px}
.gform input{flex:1;min-width:0;font:inherit;font-size:20px;padding:11px 14px;background:#150f1e;color:var(--parch);border:0;box-shadow:inset 0 0 0 2px var(--edge-hi);outline:0}
.gform input:focus{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px #e0b05055}
.guesses{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.gs{background:#1a1324;padding:10px 12px;box-shadow:inset 4px 0 0 var(--hc),0 0 0 2px var(--edge);display:grid;gap:6px}
.gs.last{box-shadow:inset 4px 0 0 var(--hc),0 0 0 2px var(--hc),0 0 18px color-mix(in srgb,var(--hc) 45%,transparent);animation:pop .25s ease-out}
.gw{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gw b{font-size:21px}.gw span{color:var(--hc);font-weight:600;font-size:14px;text-align:right}
.gb{height:10px;background:#0f0a15;box-shadow:inset 0 0 0 2px #000}
.gb i{display:block;height:100%;background:var(--hc);box-shadow:inset 0 -3px 0 #0003;transition:width .5s}
.gs p{margin:0;color:var(--parch-dim);font-size:14px}
</style>

<style>
/* Rozložení: desktop = hrad vedle hry (seznam tipů scrolluje uvnitř karty), mobil = přepínač Hádání / Hrad. */
body{padding-block:14px 24px}
.main{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px; align-items:start}
.castle{min-width:0}
.main>.panel{grid-column:1/-1; margin-top:0}
.stage{max-width:none; width:min(100%,max(300px,calc(100dvh - 360px)),540px); margin:0 auto}
.gamewrap{position:relative; align-self:stretch; min-width:0; min-height:540px}
.game{position:absolute; inset:0; width:auto; max-width:none; margin:0; display:flex; flex-direction:column; padding:16px 16px 14px; overflow:hidden}
.game>*{flex:none}
.game>.guesses{flex:1 1 0; min-height:0; overflow-y:auto; padding:2px 4px 4px 2px; scrollbar-width:thin; scrollbar-color:var(--wood-hi) var(--edge)}
.game .gs{flex:none}
.glast:empty{display:none}
.glast{margin-top:6px}
.glast+.guesses{margin-top:8px}
.msg{min-height:22px; margin-bottom:2px}
.result{margin:2px 0 8px}
.nav{display:none}
.tab.pending::after{content:""; display:inline-block; width:8px; height:8px; margin-left:8px; background:var(--gold); box-shadow:0 0 0 2px var(--edge); animation:pop .6s ease-in-out infinite alternate}

@media (max-width:860px){
  body{padding-block:8px}
  .page{height:calc(100vh - 16px); height:calc(100dvh - 16px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); gap:10px}
  .top{gap:8px; align-items:center}
  h1{font-size:clamp(20px,6vw,26px)}
  .tag,.foot{display:none}
  .stats{width:100%; gap:6px}
  .stat{flex:1; min-width:0; flex-direction:row; align-items:baseline; justify-content:center; gap:6px; padding:5px 8px}
  .stat b{font-size:18px}
  .stat span{font-size:10px; letter-spacing:.06em}
  .main{display:flex; flex-direction:column; gap:12px; flex:1; min-height:0; overflow-y:auto; padding:5px}
  .gamewrap{flex:1; min-height:0}
  .game{padding:12px 12px 10px; box-shadow:0 0 0 2px var(--edge),0 0 0 4px var(--edge-hi)}
  .game h2{font-size:20px}
  .modes{margin-top:8px}
  .modes .tab{padding:6px 12px; font-size:15px}
  .gform{margin:10px 0 4px}
  .gform input{font-size:18px; padding:9px 12px}
  .gs{padding:8px 10px}
  .gw b{font-size:18px}
  .gs p{font-size:13px}
  .stage{width:100%}
  .pgrid{grid-template-columns:1fr}
  .panel{min-height:0}
  body[data-view="game"] .castle, body[data-view="game"] .panel{display:none}
  body[data-view="castle"] .gamewrap{display:none}
  .nav{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:2px 3px 4px}
  .nav .tab{padding:12px 8px; font-size:17px; text-align:center}
}
</style>
<style>
/* ---------- vzhled: zlatý rám, lesk, jemné animace ---------- */
.stage{box-shadow:0 0 0 3px #f0c860,0 0 0 5px #8a5a1c,0 0 0 8px var(--edge),0 0 36px rgba(224,176,80,.28),0 18px 40px #000a}
.tab{transition:filter .15s,transform .08s}
.tab:hover:not(:disabled){filter:brightness(1.18)}
.tab:active:not(:disabled){transform:translateY(2px)}
.tab[aria-selected="true"]{background:linear-gradient(#9468d4,#6a3fa8);box-shadow:0 0 0 2px var(--edge),0 3px 0 2px var(--edge),inset 0 2px 0 rgba(255,255,255,.28)}
.btn{background:linear-gradient(#9468d4,#6a3fa8);box-shadow:0 0 0 2px var(--edge),0 4px 0 2px var(--edge),inset 0 2px 0 rgba(255,255,255,.28)}
.btn:hover{background:linear-gradient(#a57ae4,#7a4cb8)}
.btn.ghost{background:linear-gradient(#7c5640,#5a3a28)}
.btn.ghost:hover{background:linear-gradient(#8f6650,#6b4a33)}
.stat{position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--parch-dim);opacity:.5}
.stat.gold::before,.stat.has::before{background:var(--gold);opacity:1}
.stat.gold b{text-shadow:0 0 10px rgba(224,176,80,.55)}
.pb{background:linear-gradient(#211936,#18121f);box-shadow:0 0 0 2px var(--edge),inset 0 1px 0 rgba(255,255,255,.07)}
.pb b{color:var(--gold)}
.gform input{background:linear-gradient(#100b18,#170f21)}
.gs{background:linear-gradient(90deg,color-mix(in srgb,var(--hc) 14%,#1a1324),#1a1324 65%)}
.gb i{background:linear-gradient(var(--hc),color-mix(in srgb,var(--hc) 65%,#000))}
.gs.last{animation:pop .25s ease-out}
.result{background:linear-gradient(#34283f,#2a2034);box-shadow:0 0 0 2px var(--gold),0 3px 0 2px var(--edge),0 0 22px rgba(224,176,80,.18)}
.tile{box-shadow:0 0 0 2px var(--edge-hi)}
body::before{animation:twk 7s ease-in-out infinite}
@keyframes twk{50%{opacity:.14}}
h1{animation:glow 5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 3px 0 #0f0a15) drop-shadow(0 0 10px rgba(224,176,80,.35))}}
.nav .tab[aria-selected="true"]{background:linear-gradient(#9468d4,#6a3fa8)}
@media (prefers-reduced-motion: reduce){body::before,h1{animation:none !important}}
</style>
<div class="page">
  <header class="top">
    <div>
      <h1>Slovní království</h1>
      <p class="tag">Hádej tajné slovo. Čím blíž významem, tím žhavěji hoří království. Uhodneš a hrad naroste o patro.</p>
    </div>
    <div class="stats">
      <div class="stat gold" id="stPieces"><b id="nPieces">5 m</b><span>Výška</span></div>
      <div class="stat" id="stStreak"><b id="nStreak">0</b><span>Série</span></div>
      <div class="stat"><b id="nWon">0</b><span>Slova</span></div>
    </div>
  </header>

  <main class="main" id="main">
  <section class="castle" aria-label="Hrad">
    <div class="stage-head">
      <div class="tabs"><button class="tab" id="goTop" type="button">Vršek</button><button class="tab" id="goBase" type="button">Základy</button></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="stage" id="stage">
      <div class="stage-in" id="stageIn">
        <canvas id="scene" role="img" aria-label="Rostoucí hrad s pravítkem výšky"></canvas>
      </div>
    </div>
  </section>

  <div class="gamewrap"><section class="game" aria-label="Hádání slov">
    <div class="ghead"><h2 id="gTitle">Slovo dne</h2>
    <div class="meta"><span id="gDate"></span><span id="gCount"></span></div></div>
    <div class="modes" id="modes"></div>
    <form class="gform" id="gf" autocomplete="off"><input id="gi" type="text" maxlength="24" placeholder="Zadej slovo…" aria-label="Tvůj tip" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Hádat</button></form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="result" id="result" hidden></div>
    <div class="glast" id="glast"></div>
    <div class="guesses" id="guesses"></div>
  </section></div>

  <div class="panel" id="panel"></div>
  </main>

  <nav class="nav" aria-label="Přepínač zobrazení">
    <button class="tab" id="navGame" type="button" aria-selected="true">Hádání</button>
    <button class="tab" id="navCastle" type="button" aria-selected="false">Hrad</button>
  </nav>

  <p class="foot">Slovo dne se mění o půlnoci. Postup království se ukládá jen v tomto prohlížeči.</p>
</div>

<script>
(function(){
'use strict';
const MULT=31;
const USE_AI=true;                /* true = neznámá slova hodnotí AI (pomalejší), false = hned nízká úroveň */
const EXTRA_WORDS=true;           /* false = jen jedno slovo denně, bez extra slov */
const KEY='slovni-kralovstvi-v1';
const reduce=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=id=>document.getElementById(id);
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();

/* ---------- uložený stav ---------- */
const FH=12, VW=144, VH=144, CX=106, ROOF=46, GROUND=34;   /* výška patra, velikost výřezu, střed věže */
function fresh(){return{v:3,won:0,extra:0,royalN:0,daily:0,seenN:0,streak:{n:0,last:null,best:0},day:null,bonus:null};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);
  if(o&&o.v===3)return o;
  if(o&&(o.v===1||o.v===2)){const n=fresh();n.won=o.won||0;n.daily=o.daily||0;n.day=o.day||null;n.bonus=o.bonus||null;n.royal=o.royal||null;n.seenN=n.won;return n;}}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const nWords=()=>(S.won||0)+(S.extra||0);
if(S.seenN==null||S.seenN>nWords())S.seenN=nWords();
S.streak=S.streak||{n:0,last:null,best:0};
const cz=(n,a,b,d)=>n===1?a:(n>=2&&n<=4)?b:d;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ui={disp:S.seenN,grow:null};
const heightM=()=>5*(1+nWords());

/* série: den se počítá, když hráč uhodne aspoň jedno slovo (slovo dne, extra i královské) */
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey=()=>dkey(new Date());
const yestKey=()=>{const d=new Date();d.setDate(d.getDate()-1);return dkey(d);};
const streakNow=()=>(S.streak.last===todayKey()||S.streak.last===yestKey())?(S.streak.n||0):0;
const streakDone=()=>S.streak.last===todayKey();
function markStreak(){const s=S.streak,t=todayKey();if(s.last===t)return;s.n=(s.last===yestKey()?(s.n||0):0)+1;s.last=t;s.best=Math.max(s.best||0,s.n);}

/* ---------- materiály, orientační body ---------- */
const MATS=[
 {n:'dřevěná',b:'#7a4a2b',d:'#4f2f1c',l:'#a8693a',roof:'#d9b866',roofD:'#b08f40'},
 {n:'kamenná',b:'#8b8f98',d:'#5d616b',l:'#b3b7c0',roof:'#9a3b34',roofD:'#6e2a26'},
 {n:'pískovcová',b:'#c9a063',d:'#8f6a3a',l:'#e0c08a',roof:'#4c4f63',roofD:'#33364a'},

/* ---------- pomocné kreslení ---------- */
const canvasEl=$('scene');let ctx=null,c=null,T=0;
function px(x,y,w,h,col){c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function hh(a,b){let h=(Math.imul(a|0,374761393)+Math.imul(b|0,668265263))>>>0;h=Math.imul(h^(h>>>13),1274126177)>>>0;return(((h^(h>>>16))>>>0)%10000)/10000;}
function tri(cx,top,h,half,col){for(let i=0;i<h;i++){const w=Math.round((i+1)*half/h);px(cx-w,top+i,w*2+1,1,col);}}
function wave(x,y,w,h,col){for(let k=0;k<w;k++)px(x+k,y+Math.round(Math.sin(T*4+k*.8)),1,h,col);}
const DG={0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111'};
function num(s,x,y,col){s=String(s);for(let i=0;i<s.length;i++){const g=DG[s[i]];for(let k=0;k<15;k++)if(g[k]==='1')px(x+i*4+k%3,y+((k/3)|0),1,1,col);}}
const lerp=(a,b,t)=>a+(b-a)*t,cl01=x=>Math.max(0,Math.min(1,x));
const mixc=(A,B,t)=>[lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t)];
const rgb=a=>'rgb('+Math.round(a[0])+','+Math.round(a[1])+','+Math.round(a[2])+')';
/* pomocné kreslící funkce: kruh, stínování, zesvětlení */
function disc(cx,cy,r,col){for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(Math.max(0,r*r-dy*dy+.25)));px(cx-w,cy+dy,w*2+1,1,col);}}
function shade(x,y,w,h,a){const g=c.globalAlpha;c.globalAlpha=g*a;px(x,y,w,h,'#000');c.globalAlpha=g;}
function lite(x,y,w,h,a){const g=c.globalAlpha;c.globalAlpha=g*a;px(x,y,w,h,'#fff');c.globalAlpha=g;}
function tint(x,y,w,h,col,a){const g=c.globalAlpha;c.globalAlpha=g*a;px(x,y,w,h,col);c.globalAlpha=g;}
/* denní doba podle hodin: [den, soumrak, noc] */
function weights(h){

  if(h<17.5)return[1,0,0];if(h<19)return[1-(h-17.5)/1.5,(h-17.5)/1.5,0];if(h<20.5)return[0,1-(h-19)/1.5,(h-19)/1.5];return[0,0,1];}
const SKH=[[191,227,242],[243,163,126],[84,76,128]],SKM=[[95,166,220],[138,90,158],[34,28,72]],SKS=[7,5,15];

function prepSky(){
  SKA=[0,1,2].reduce((s,i)=>[s[0]+SKH[i][0]*WT[i],s[1]+SKH[i][1]*WT[i],s[2]+SKH[i][2]*WT[i]],[0,0,0]);
  SKB=[0,1,2].reduce((s,i)=>[s[0]+SKM[i][0]*WT[i],s[1]+SKM[i][1]*WT[i],s[2]+SKM[i][2]*WT[i]],[0,0,0]);}
function skyAt(am){am=Math.max(0,am);return rgb(am<500?mixc(SKA,SKB,am/500):mixc(SKB,SKS,cl01((am-500)/5500)));}

/* ---------- jedno patro věže ---------- */
let partial=false;const LW=[],LG=[];   /* LW = jasné plošky (okna, plameny) vykreslené až po barevném ladění, LG = zdroje záře */
const SHUT=['#2f6a5a','#7a3a30','#3a4a7a'];
function windowAt(wx,y,lit,m,mi){
  const fr=mi===0?'#3a2415':mi===3?'#9c8a5a':mi===4?'#3a2d52':'#2f2a38';
  if(mi<=2){const sc=SHUT[mi];px(wx-2,y+3,2,6,sc);px(wx+5,y+3,2,6,sc);lite(wx-2,y+3,1,6,.25);shade(wx+6,y+3,1,6,.3);shade(wx-2,y+5,2,1,.4);shade(wx+5,y+5,2,1,.4);}
  px(wx+1,y+2,3,1,fr);px(wx,y+3,5,6,fr);
  if(lit){px(wx+1,y+3,3,2,'#ffe9a0');px(wx+1,y+6,3,2,'#f2a33c');}
  else{px(wx+1,y+3,3,2,'#27345a');px(wx+1,y+6,3,2,'#1c2444');px(wx+1,y+3,1,1,'#7f9fd0');px(wx+3,y+6,1,1,'#3b4a78');}
  px(wx+1,y+5,3,1,fr);
  px(wx-1,y+9,7,1,m.l);shade(wx-1,y+10,7,1,.28);
  if(lit&&!partial){LW.push([wx+1,y+3,3,2,'#ffe9a0'],[wx+1,y+6,3,2,'#f2a33c']);LG.push({x:wx+2,y:y+6,r:8,k:.7});}
}
function wallTex(j,x,y,w,mi,m){
  if(mi===0){
    for(let xx=x,i=0;xx<x+w;xx+=3,i++){const ww=Math.min(2,x+w-xx),v=hh(j*7+i,3);
      if(v<.33)lite(xx,y,ww,FH,.07);else if(v>.7)shade(xx,y,ww,FH,.1);
      if(xx+2<x+w)px(xx+2,y,1,FH,m.d);
      if(hh(j+i*5,9)<.12)px(xx,y+3+((hh(i,j)*6)|0),1,1,m.d);}
    px(x,y,w,2,m.d);lite(x,y+1,w,1,.12);px(x,y+FH-2,w,2,m.d);
    for(let xx=x+3;xx<x+w-3;xx+=8){px(xx,y,1,1,'#2b2430');px(xx,y+FH-2,1,1,'#2b2430');}
  }else if(mi===1||mi===2){
    for(let r=0;r<4;r++){const ry=y+r*3,off=((j+r)%2)*3;
      for(let xx=x-off;xx<x+w;xx+=6){const X=Math.max(x,xx),W=Math.min(x+w,xx+6)-X;if(W<=0)continue;const v=hh(xx*3+j,r+j*11);
        if(v<.25)lite(X,ry,W,2,.1);else if(v>.72)shade(X,ry,W,2,.11);}
      shade(x,ry+2,w,1,.32);
      for(let xx=x-off+6;xx<x+w;xx+=6)if(xx>x)shade(xx,ry,1,2,.3);}
  }else if(mi===3){
    shade(x,y+5,w,1,.14);shade(x+(w>>1),y,1,FH,.12);
    for(let k=0;k<3;k++){const vx=x+5+((hh(j,k+20)*(w-14))|0),vy=y+1+((hh(j,k+30)*4)|0);
      px(vx,vy,1,1,'#bfb9ad');px(vx+1,vy+1,1,1,'#bfb9ad');px(vx+2,vy+1,1,1,'#cfc8bb');px(vx+3,vy+2,1,1,'#bfb9ad');}
    px(x,y,w,1,'#e0b050');px(x,y+FH-1,w,1,'#c99a3c');
    lite(x+2,y+1,2,FH-2,.35);shade(x+w-5,y+1,2,FH-2,.12);
    px(x+1,y+1,4,1,'#e8e2d2');px(x+1,y+FH-2,4,1,'#cfc8bb');
  }else{
    for(let xx=x-FH;xx<x+w;xx+=9)for(let t=0;t<FH;t++){const X=xx+t;if(X>x+1&&X<x+w-2)px(X,y+t,1,1,t%2?'#a98fd0':m.l);}
    for(let xx=x;xx<x+w+FH;xx+=9)for(let t=0;t<FH;t++){const X=xx-t;if(X>x+1&&X<x+w-2)shade(X,y+t,1,1,.2);}
    lite(x+(w>>1),y,1,FH,.18);
    for(let k=0;k<3;k++)if(Math.sin(T*3+j*1.7+k*2.3)>.55)px(x+3+((hh(j,k+3)*(w-8))|0),y+2+((hh(j,k+4)*7)|0),1,1,'#fff');
  }
}
function drawFloor(j,y){
  const w=floorW(j),x=CX-(w>>1),mi=matOf(j),m=MATS[mi];
  px(x,y,w,FH,m.b);
  wallTex(j,x,y,w,mi,m);
  /* světlo zleva, stín zprava, římsa nahoře, stín dole */
  lite(x,y,1,FH,.38);lite(x+1,y,1,FH,.16);shade(x+w-3,y,3,FH,.3);shade(x+w-7,y,4,FH,.1);
  lite(x,y,w,1,.16);shade(x,y+FH-1,w,1,.3);
  tint(x-1,y,1,FH,'#0a0610',.55);tint(x+w,y,1,FH,'#0a0610',.55);
  const night=WT[2]>.5;
  if(j===0){
    /* brána s obloukem, železnými pásy a cvočky */
    px(CX-5,y+3,10,8,'#5a3a22');px(CX-4,y+2,8,1,'#5a3a22');px(CX-3,y+1,6,1,'#5a3a22');
    px(CX-2,y+2,1,9,'#3a2314');px(CX,y+1,1,10,'#3a2314');px(CX+2,y+2,1,9,'#3a2314');

  }else{
    const o=Math.round(w*.27);
    windowAt(CX-o-2,y,hh(j,7)<(night?.75:.12),m,mi);
    windowAt(CX+o-2,y,hh(j,8)<(night?.7:.1),m,mi);
    if(j%10===9){
      px(CX-3,y+1,6,8,'#7a4cb8');shade(CX+1,y+1,2,8,.2);px(CX-3,y+1,6,1,'#e0b050');px(CX-1,y+4,2,2,'#e0b050');
      px(CX-3,y+9,2,1,'#7a4cb8');px(CX+1,y+9,2,1,'#7a4cb8');
    }else if(j%3===1){
      const sc=['#7a4cb8','#c25a4c','#4f7c9e'][(hh(j,40)*3)|0];
      px(CX-2,y+3,4,5,'#2a2034');px(CX-1,y+4,2,3,sc);px(CX-1,y+4,2,1,'#e0b050');px(CX,y+5,1,2,'#e0b050');px(CX-1,y+8,2,1,'#2a2034');
    }else if(j%3===0&&w>=30){
      px(CX-1,y+3,2,6,'#150f1e');lite(CX-1,y+3,1,1,.25);
    }
  }
  if(j%6===5){
    px(x-3,y+FH-3,w+6,2,m.l);lite(x-3,y+FH-3,w+6,1,.25);shade(x-3,y+FH-1,w+6,1,.4);
    for(let xx=x-3;xx<x+w+3;xx+=3)px(xx,y+FH-6,1,3,m.d);
    px(x-3,y+FH-6,w+6,1,m.d);
  }
  if(j%25===24){px(x-1,y,w+2,2,'#e0b050');lite(x-1,y,w+2,1,.45);shade(x-1,y+2,w+2,1,.3);}

/* ---------- orientační body (siluety) ---------- */
function lmSeg(l,a){
  const m=l.m*FH/5;if(l.k==='everest'||a<0||a>m)return null;
  switch(l.k){
    case'kostel':if(a<24)return[[l.x,l.x+16]];if(a<36)return[[l.x+9,l.x+15]];{const hw=Math.round(3*(48-a)/12);return[[l.x+12-hw,l.x+13+hw]];}
    case'petrin':{let hw=Math.round(1+6*Math.pow(1-a/m,1.6));if(a>108&&a<114)hw+=2;const cx=l.x+7;return[[cx-hw,cx+hw+1]];}
    case'eiffel':{let hw=Math.round(1+17*Math.pow(1-a/m,2.3));if((a>134&&a<139)||(a>273&&a<277))hw+=2;const cx=l.x+18;
      if(a<36)return[[cx-hw,cx-hw+4],[cx+hw-3,cx+hw+1]];return[[cx-hw,cx+hw+1]];}
    case'burj':{const hw=a<600?6:a<1000?5:a<1400?4:a<1700?3:1;const cx=l.x+6;return[[cx-hw,cx+hw+1]];}
    case'snezka':{const hw=Math.round(22*(1-a/m)),cx=l.x+22;return[[cx-hw,cx+hw+1,a>m*.85?'#dcd8ea':null]];}
  }
  return null;}
function landmarks(base,topX){
  for(const l of LM){if(l.k==='everest')continue;
    const m=l.m*FH/5;
    for(let y=0;y<VH;y++){const a=base-y;if(a<0||a>m)continue;const sg=lmSeg(l,a);if(!sg)continue;
      c.globalAlpha=l.al;sg.forEach(s=>px(s[0],y,s[1]-s[0],1,s[2]||l.col));c.globalAlpha=1;}
    const yt=Math.round(base-m);
    if(yt>=0&&yt<VH){const got=heightM()>=l.m;c.globalAlpha=got?.9:.45;
      for(let x=20;x<topX-2;x+=6)px(x,yt,3,1,got?'#e0b050':'#a79ac8');
      c.globalAlpha=.7;px(19,yt-7,String(l.m).length*4+1,7,'#0a0814');c.globalAlpha=1;
      num(l.m,20,yt-6,got?'#e0b050':'#cfc4e8');}}
}

/* ---------- zem, krajina, postavy ---------- */
/* panáček: d = ušlá vzdálenost v pixelech, nohy se střídají podle ní; v = vzhled (0 sedlák, 1 rytíř, 2 mág) */
function person(x,y,col,dir,d,v){
  x=Math.round(x);y=Math.round(y);
  const st=Math.floor(d/2.5)%2,up=st?0:1,L='#2b2430',SK='#e7b98f',BT='#4a3224',hy=y-10-up;
  shade(x-2,y,5,1,.28);
  if(st){px(x-1,y-3,1,3,L);px(x+1,y-3,1,3,L);px(x-1,y-1,1,1,BT);px(x+1,y-1,1,1,BT);}
  else{px(x,y-4,1,4,L);px(x-dir,y-4,1,2,L);px(x,y-1,1,1,BT);}
  const bc=v===1?'#9aa0aa':col;
  px(x-1,y-7-up,3,4,bc);
  if(v===1){px(x-1,y-5-up,3,1,col);lite(x-1,y-7-up,3,1,.3);}else px(x-1,y-5-up,3,1,BT);
  shade(x-dir,y-7-up,1,4,.16);
  px(x+(st?dir:-dir)*2,y-6-up,1,2,bc);
  px(x-1,hy,3,3,SK);
  if(v===0){px(x-2,hy,5,1,'#d9b866');px(x-1,hy-1,3,1,'#d9b866');px(x+dir,hy+1,1,1,L);}
  else if(v===1){px(x-1,hy,3,3,'#b3b7c0');lite(x-1,hy,1,2,.4);px(x+dir,hy+1,1,1,L);px(x,hy-2,1,2,'#c25a4c');}
  else{px(x-1,hy+2,3,1,'#e8e4d8');px(x+dir,hy+1,1,1,L);px(x-2,hy,5,1,'#5b3a8a');px(x-1,hy-1,3,1,'#5b3a8a');px(x,hy-3,1,2,'#5b3a8a');px(x-dir,hy-3,1,1,'#5b3a8a');}
}
function walkers(base,F){
  const nW=Math.min(6,1+(F/8|0)),cols=['#4f7c9e','#9e4f4f','#6a8f4a','#b0843a','#7a5aa0','#4a8f8f'],X0=24,X1=124,Lg=X1-X0,arr=[];
  for(let i=0;i<nW;i++){
    const sp=5+(i%3)*1.5,p=(T*sp+hh(i,21)*2*Lg)%(2*Lg),fwd=p<Lg;

}
/* plameny, pochodně, táborák a kouř */
function flame(x,y,r){

  [[x-1,y-3+f,3,3,'#e8641c'],[x-1,y-2,3,2,'#f08a2c'],[x,y-4+g,1,4,'#f2c14e'],[x,y-2,1,1,'#fff6c0']].forEach(a=>{px(a[0],a[1],a[2],a[3],a[4]);LW.push(a);});

}
function torch(x,y){px(x,y-9,1,9,'#4a3224');px(x-1,y-9,3,1,'#2b2430');px(x-1,y-10,1,1,'#2b2430');px(x+1,y-10,1,1,'#2b2430');flame(x,y-9,10);}
function bonfire(x,b){
  px(x-5,b-1,2,2,'#8b8f98');px(x-2,b,2,1,'#6f7380');px(x+1,b,2,1,'#8b8f98');px(x+4,b-1,2,2,'#6f7380');
  px(x-4,b-2,9,2,'#4a3224');px(x-3,b-3,7,1,'#6b4a33');

function smoke(x,y){for(let k=0;k<5;k++){const t=(T*.5+k*.2)%1;c.globalAlpha=(1-t)*.5;px(x+Math.sin(T*1.2+k*1.9)*1.5+t*5,y-t*18,t>.5?3:2,t>.5?3:2,'#e9e6f0');}c.globalAlpha=1;}
/* stromy, keře, kopce */
function tier(cx,top,h,half,dk,md,lt){

    px(cx-w,y,w*2+1,1,md);px(cx+s,y,w-s+1,1,dk);px(cx-w,y,Math.max(1,Math.round(w*.5)),1,lt);}

function pine(x,b,h){

  const th=Math.round(h*.42),st=Math.round(h*.27);

function oak(x,b,r){

  [S.day&&S.day.i,S.bonus&&S.bonus.i].forEach(x=>{if(typeof x==='number'&&u.indexOf(x)<0)u.push(x);});
  let pool=[];for(let i=0;i<SEC.length;i++)if(u.indexOf(i)<0&&i!==skip)pool.push(i);
  if(!pool.length){S.used=[];for(let i=0;i<SEC.length;i++)if(i!==skip)pool.push(i);}
  const i=pool[Math.floor(Math.random()*pool.length)];S.used.push(i);return i;}

function stemFind(k){const EN=['','u','a','e','i','y','em','ou','ovi','ech','ach','ami','ům','um','ě'];let best=null,bl=0;
  for(const o of V){const a=o.k;let i=0;const n=Math.min(a.length,k.length);while(i<n&&a[i]===k[i])i++;

  return best;}

  if(window.fbAsk)racers.push(withTO(window.fbAsk(P),7000).then(parse));
  else window.lastAIError='Firebase AI se nenačetla'+(window.fbErr?' ('+window.fbErr+')':'')+'.';
  racers.push(withTO(fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:150,messages:[{role:"user",content:P}]})}),7000)
    .then(r=>r.json()).then(d=>parse(d.content.map(i=>i.text||'').join(''))));
  try{
    const r=await Promise.any(racers);
    try{localStorage.setItem(ck,JSON.stringify(r));}catch(e){}
    return r;
  }catch(err){window.lastAIError=(err.errors||[err]).map(e=>e&&e.message||e).join(' | ');if(/429|quota|exceeded/i.test(window.lastAIError))window.aiCool=Date.now()+60000;return null;}
}
async function submit(e){
  if(e)e.preventDefault();
  const C=cur;
  if(C.st.done||busyAI)return;
  let aiFail=false;
  const raw=gi.value.trim(),k=strip(raw).replace(/\s+/g,'');
  if(!k)return;
  if(C.st.g.indexOf(k)>=0){setMsg('Tohle už jsi zkoušel.',1800);return;}
  if(!VI[k]){
    /* slovo mimo slovník: hned ho přijmeme jako velmi vzdálené, bez čekání na AI */
    if(!/^[a-zA-Z\u00C0-\u017F]{2,24}$/.test(raw)){setMsg('Tohle není slovo.',2000);return;}
    let r=null;
    if(USE_AI){
      busyAI=true;setMsg('Písař listuje slovníkem…');
      r=await askAI(C,raw);busyAI=false;
      if(cur!==C)return;
      if(r&&!r.real){setMsg('Tohle není české slovo.',2400);return;}
    }
    if(!r){const sf=stemFind(k);aiFail=USE_AI&&!sf;
      r={real:true,rank:sf&&C.rk[sf]?Math.max(2,C.rk[sf]):Math.round(V.length*.9),hint:aiFail?'AI nedostupná, hrubý odhad.':''};}
    C.st.x=C.st.x||{};C.st.x[k]={w:raw.toLowerCase(),r:r.rank,h:r.hint};
  }
  C.st.g.push(k);gi.value='';setMsg('');
  if(aiFail){const er=String(window.lastAIError||'neznámá chyba');console.warn('AI hodnocení selhalo:',er);setMsg(/429|quota|exceeded/i.test(er)?'AI má vyčerpaný limit dotazů, zkus to za chvíli. Zatím je to hrubý odhad.':'AI neodpověděla: '+er.slice(0,160),9000);}
  if(k===C.word){C.st.done=true;C.st.won=true;S.won++;if(C.mode==='daily')S.daily=(S.daily||0)+1;if(C.mode==='royal'){S.extra=(S.extra||0)+2;S.royalN=(S.royalN||0)+1;}markStreak();}
  save();renderGuesses();renderAll();showResult();
  if(k===C.word&&stageVisible())startGrow();
  gi.focus({preventScroll:true});
}
function showResult(){
  const st=cur.st,n=st.g.length;let h='';
  $('gf').hidden=!!st.done;
  if(!st.done){resultEl.hidden=true;resultEl.innerHTML='';return;}
  if(st.won)h+='<p class="rt">'+(n<=3?'Skvěle!':n<=8?'Výborně!':'Uhodnuto!')+'</p><p>Slovo <b class="answer">'+cur.full.toUpperCase()+'</b> máš na '+n+'. pokus. '+(cur.mode==='royal'?'Královské slovo! Hrad roste o 3 patra a dostává zlatou ozdobu.':'Hrad naroste o jedno patro.')+'</p><p class="cd">Série: <b>'+streakNow()+'</b> '+cz(streakNow(),'den','dny','dní')+' v řadě.</p>';
  else h+='<p class="rt">Tentokrát ne.</p><p>Hledané slovo: <b class="answer">'+cur.full.toUpperCase()+'</b></p>';
  h+='<div class="acts">';
  if(st.won)h+='<button class="btn" id="goBuild" type="button">Na hrad</button>';
  if(EXTRA_WORDS)h+='<button class="btn ghost" id="goExtra" type="button">'+(cur.mode==='daily'?'Extra slovo':'Další extra slovo')+'</button>';
  h+='</div><p class="cd">Nové slovo dne za <b id="cd"></b></p>';
  resultEl.innerHTML=h;resultEl.hidden=false;
  const gb=$('goBuild');if(gb)gb.addEventListener('click',goBuild);
  const ge=$('goExtra');if(ge)ge.addEventListener('click',()=>{startBonus(false);});
  tick();
}
const isMobile=()=>!!(window.matchMedia&&matchMedia('(max-width:860px)').matches);
function updateNav(){const b=$('navCastle');if(b)b.classList.toggle('pending',S.seenN<nWords()&&!ui.grow);}
function setView(v){
  document.body.dataset.view=v;
  $('navGame').setAttribute('aria-selected',String(v==='game'));
  $('navCastle').setAttribute('aria-selected',String(v==='castle'));
  requestAnimationFrame(()=>{layout();redraw();if(v==='castle')setTimeout(startGrow,reduce?0:250);});
}
function goBuild(){
  renderAll();
  if(isMobile()){setView('castle');return;}
  stageEl.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
  setTimeout(startGrow,reduce?0:450);
}
function tick(){
  const t=todayInfo();
  if(S.day&&S.day.key!==t.key){startDaily();renderAll();return;}
  const n=new Date(),mid=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);
  const s=Math.max(0,Math.floor((mid-n)/1000)),el=$('cd');
  if(el)el.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');
}

$('gf').addEventListener('submit',submit);

/* ---------- start ---------- */
startDaily();
if(S.day.done&&S.bonus&&!S.bonus.done)startBonus(true);
initCastle();
setInterval(tick,1000);
if(!reduce)requestAnimationFrame(frame);
})();
</script>
