<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slovní království</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: široká pixel-art scéna království nahoře (posouvá se do stran), pod ní úzký sloupec s hádáním slov.
   Vzhled je záměrně jen tmavý: večerní fialová, dřevo a zlato z předlohy. */
:root{
  --night:#1d1626; --night-2:#2a2034; --edge:#0f0a15; --edge-hi:#46385a;
  --wood:#4a3224; --wood-hi:#6b4a33;
  --parch:#efe3cc; --parch-dim:#b7a98f;
  --banner:#7a4cb8; --banner-hi:#b48ae0; --gold:#e0b050; --ok:#5d9e47; --miss:#3a2f45;
  --font:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{
  background:var(--night); color:var(--parch); font-family:var(--font); font-size:16px; line-height:1.45; margin:0;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font-family:inherit}
.page{max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:22px}
.top{display:flex; flex-wrap:wrap; gap:14px 24px; align-items:flex-end; justify-content:space-between}
h1{font-size:clamp(28px,7vw,40px); line-height:1.05; margin:0; font-weight:700; letter-spacing:.01em; text-wrap:balance}
.tag{margin:6px 0 0; color:var(--parch-dim); max-width:46ch}
.stats{display:flex; gap:10px}
.stat{background:var(--night-2); box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge); padding:8px 14px; display:flex; flex-direction:column; gap:2px; min-width:92px}
.stat b{font-size:26px; line-height:1; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--parch-dim)}
.stat.gold b{color:var(--gold)}
.stat.has{box-shadow:0 0 0 2px var(--gold), 0 3px 0 2px var(--edge)}

.stage-head{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin-bottom:10px}
.tabs{display:flex; gap:8px; flex-wrap:wrap}
.tab{color:var(--parch); background:var(--night-2); border:0; padding:8px 14px; font-size:16px; cursor:pointer; box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge)}
.tab small{margin-left:8px; color:var(--parch-dim); font-size:14px; font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--banner)}
.tab[aria-selected="true"] small{color:#e6d9f7}
.tab:disabled{opacity:.5; cursor:not-allowed}
.prog{color:var(--parch-dim); font-size:14px}
.stage{overflow-x:auto; background:#000; box-shadow:0 0 0 3px var(--edge); scrollbar-color:var(--wood-hi) var(--edge)}
.stage-in{position:relative; width:max-content}
#scene{display:block; image-rendering:pixelated}
#plots{position:absolute; inset:0}
.plot{position:absolute; top:0; height:100%; background:none; border:0; padding:0; cursor:pointer}
.plot:hover{background:rgba(255,255,255,.07)}
.plot:focus-visible{outline:3px solid var(--gold); outline-offset:-3px}

.panel{margin-top:12px; background:var(--night-2); box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge); padding:14px 16px; min-height:96px; display:flex; flex-direction:column; gap:12px}
.panel p{margin:0}
.panel .lead{color:var(--parch-dim)}
.up{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; background:var(--wood); padding:12px 14px; box-shadow:0 0 0 2px var(--edge)}
.up b{font-size:18px}
.info b{font-size:20px}
.picks{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x proximity; scrollbar-color:var(--wood-hi) var(--edge)}
.pick{flex:0 0 auto; scroll-snap-align:start; width:100px; padding:8px 8px 10px; background:var(--wood); color:var(--parch); border:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge)}
.pick:hover{background:var(--wood-hi)}
.pick:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.pick canvas{width:84px; height:156px; image-rendering:pixelated; display:block}
.pick span{font-size:14px; font-weight:600; text-align:center; line-height:1.15}

.btn{background:var(--banner); color:#fff; border:0; padding:10px 18px; font-size:16px; font-weight:600; cursor:pointer; box-shadow:0 0 0 2px var(--edge), 0 4px 0 2px var(--edge)}
.btn:hover{background:#8a5cc8}
.btn:active{transform:translateY(2px); box-shadow:0 0 0 2px var(--edge), 0 2px 0 2px var(--edge)}
.btn:focus-visible,.key:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.btn.ghost{background:var(--wood)}
.btn.ghost:hover{background:var(--wood-hi)}

.game{width:100%; max-width:520px; margin:0 auto}
.game h2{font-size:24px; margin:0 0 2px; line-height:1.1}
.meta{display:flex; flex-wrap:wrap; justify-content:space-between; gap:2px 12px; color:var(--parch-dim); font-size:14px}
.board{display:grid; gap:6px; max-width:340px; margin:16px auto 8px}
.row{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.tile{aspect-ratio:1; display:grid; place-items:center; font-size:clamp(24px,8vw,34px); font-weight:700; background:var(--night-2); box-shadow:0 0 0 2px var(--edge-hi); user-select:none}
.tile.filled{box-shadow:0 0 0 2px var(--parch-dim); animation:pop .1s ease-out}
.tile.c{background:var(--ok); color:#fff; box-shadow:0 0 0 2px #3c6b2e, inset 0 -4px 0 rgba(0,0,0,.25)}
.tile.p{background:var(--gold); color:#2a1d10; box-shadow:0 0 0 2px #a8812e, inset 0 -4px 0 rgba(0,0,0,.2)}
.tile.x{background:var(--miss); color:var(--parch-dim); box-shadow:0 0 0 2px #2c2336}
.tile.flipping{animation:flip .5s ease-in-out}
.row.shake{animation:shake .4s}
@keyframes pop{from{transform:scale(.88)} to{transform:scale(1)}}
@keyframes flip{0%{transform:scaleY(1)} 50%{transform:scaleY(0)} 100%{transform:scaleY(1)}}
@keyframes shake{20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}}
.msg{min-height:26px; text-align:center; color:var(--gold); font-weight:600; margin-bottom:4px}
.result{background:var(--night-2); box-shadow:0 0 0 2px var(--edge), 0 3px 0 2px var(--edge); padding:14px 16px; margin:4px 0 16px; display:flex; flex-direction:column; gap:10px}
.result p{margin:0}
.result .rt{font-size:20px; font-weight:700}
.answer{color:var(--gold); letter-spacing:.12em}
.acts{display:flex; flex-wrap:wrap; gap:10px}
.cd{color:var(--parch-dim); font-size:14px}
.cd b{color:var(--parch); font-variant-numeric:tabular-nums}
.kb{display:grid; gap:6px}
.kr{display:flex; gap:5px; justify-content:center}
.key{flex:1 1 0; min-width:0; height:50px; background:#4b3c5e; color:var(--parch); border:0; font-size:17px; font-weight:600; cursor:pointer; text-transform:uppercase; touch-action:manipulation; box-shadow:0 3px 0 var(--edge)}
.key.wide{flex:1.7 1 0; font-size:12px; text-transform:none; letter-spacing:.02em}
.key.c{background:var(--ok); color:#fff}
.key.p{background:var(--gold); color:#2a1d10}
.key.x{background:#241c2d; color:#6f6380}
.key:active{transform:translateY(2px); box-shadow:0 1px 0 var(--edge)}
.foot{text-align:center; color:var(--parch-dim); font-size:13px; max-width:60ch; margin:0 auto}
@media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important} }
</style>

<style>
body{background:radial-gradient(ellipse at 50% -10%,#4b2f6e 0,#2a1d3f 38%,#150f1e 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff8 1px,transparent 1.5px),radial-gradient(#f2c14e88 1px,transparent 1.5px);background-size:90px 90px,140px 140px;background-position:0 0,40px 55px;opacity:.35}
.page{position:relative}
h1{background:linear-gradient(#fff3c4,#e0b050 55%,#a8742a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0f0a15)}
.stat{background:linear-gradient(#34283f,#2a2034)}
.stage{box-shadow:0 0 0 3px #e0b050,0 0 0 6px var(--edge),0 18px 40px #0009}
.stage-in::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#0006 100%)}
.panel{background:linear-gradient(#2e2340,#241b32)}
.game{background:linear-gradient(#2e2340,#221a30);padding:20px 18px 22px;box-shadow:0 0 0 2px var(--edge),0 0 0 4px var(--edge-hi),0 14px 30px #0008}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0}
.gform{display:flex;gap:8px;margin:14px 0 6px}
.gform input{flex:1;min-width:0;font:inherit;font-size:20px;padding:11px 14px;background:#150f1e;color:var(--parch);border:0;box-shadow:inset 0 0 0 2px var(--edge-hi);outline:0}
.gform input:focus{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px #e0b05055}
.guesses{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.gs{background:#1a1324;padding:10px 12px;box-shadow:inset 4px 0 0 var(--hc),0 0 0 2px var(--edge);display:grid;gap:6px}
.gs.last{box-shadow:inset 4px 0 0 var(--hc),0 0 0 2px var(--hc),0 0 18px color-mix(in srgb,var(--hc) 45%,transparent);animation:pop .25s ease-out}
.gw{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gw b{font-size:21px}.gw span{color:var(--hc);font-weight:600;font-size:14px;text-align:right}
.gb{height:10px;background:#0f0a15;box-shadow:inset 0 0 0 2px #000}
.gb i{display:block;height:100%;background:var(--hc);box-shadow:inset 0 -3px 0 #0003;transition:width .5s}
.gs p{margin:0;color:var(--parch-dim);font-size:14px}
</style>
<div class="page">
  <header class="top">
    <div>
      <h1>Slovní království</h1>
      <p class="tag">Hádej tajné slovo. Čím blíž významem, tím žhavěji hoří království. Uhodneš a dostaneš dílek na stavbu.</p>
    </div>
    <div class="stats">
      <div class="stat gold" id="stPieces"><b id="nPieces">0</b><span>Dílky</span></div>
      <div class="stat"><b id="nWon">0</b><span>Slova</span></div>
    </div>
  </header>

  <section aria-label="Království">
    <div class="stage-head">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="prog" id="prog"></div>
    </div>
    <div class="stage" id="stage">
      <div class="stage-in">
        <canvas id="scene" role="img" aria-label="Pixelové království"></canvas>
        <div id="plots"></div>
      </div>
    </div>
    <div class="panel" id="panel"></div>
  </section>

  <section class="game" aria-label="Hádání slov">
    <h2 id="gTitle">Slovo dne</h2>
    <div class="meta"><span id="gDate"></span><span>Háčky a čárky psát nemusíš</span></div>
    <div class="modes" id="modes"></div>
    <form class="gform" id="gf" autocomplete="off"><input id="gi" type="text" maxlength="24" placeholder="Zadej slovo…" aria-label="Tvůj tip" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Hádat</button></form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="result" id="result" hidden></div>
    <div class="guesses" id="guesses"></div>
  </section>

  <p class="foot">Slovo dne se mění o půlnoci. Postup království se ukládá jen v tomto prohlížeči.</p>
</div>

<script>
(function(){
'use strict';
const MULT=31;
const EXTRA_WORDS=true;           /* false = jen jedno slovo denně, bez extra slov */
const SC=2, PW=56, PAD=24, H=150, GY=120, EB=132;
const KEY='slovni-kralovstvi-v1';
const reduce=!!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const $=id=>document.getElementById(id);
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();

/* ---------- barvy a úrovně ---------- */
const K={wood:'#7a4a2b',woodD:'#4f2f1c',woodL:'#a8693a',thatch:'#d9b866',thatchD:'#b08f40',stone:'#8b8f98',stoneD:'#5d616b',stoneL:'#b3b7c0',
  red:'#9a3b34',redL:'#c25a4c',purple:'#6b3fa0',purpleL:'#b48ae0',white:'#f1ece0',door:'#2b1a10',glow:'#f2c14e',gold:'#e0b050',
  skin:'#e7b98f',rope:'#c9b27a',dark:'#2a1d17',orange:'#f08a2c',wheat:'#d8b24a',wheatD:'#bb8f2e',parch:'#efe3cc',slate:'#4c4f63',slateL:'#5b5e75'};
const PAL=[
 {sky:['#a89c96','#b4a8a0','#c0b4a8','#ccc0b1','#d8ccba','#e2d6c2'],hillFar:'#a29aa4',hillNear:'#85808c',tree:'#59606a',wall:'#6f6a74',wallHi:'#8b8591',cloud:'#efe9dc',cloudSh:'#cdc4b4',water:'#26344a',rip:'#9db3d0',earth:'#6b4524'},
 {sky:['#5f4f8c','#7a5c94','#a06c98','#c9808f','#e49f88','#f3c78e'],hillFar:'#8a6c98',hillNear:'#5f4d7e',tree:'#3f3562',wall:'#5a4d70',wallHi:'#7a6a92',cloud:'#f8d8aa',cloudSh:'#c58a9e',water:'#352b52',rip:'#d9a8c8',earth:'#5c3a22'}
];
const LEVELS=[
 {name:'Vesnice',plots:10,list:['hut','field','well','tower','market','palisade','forge','range','fire']},
 {name:'Hrad',plots:12,list:['keep','wall','gate','cathedral','alchemy','barracks','mill','hall']}
];
const BLD={
 fire:{n:'Táborák',d:'Kolem ohně se schází celá osada.',draw:dFire},
 hut:{n:'Chalupa',d:'Střecha nad hlavou pro nové obyvatele.',draw:dHut},
 field:{n:'Pole',d:'Zlatý ječmen, ze kterého bude chleba.',draw:dField},
 well:{n:'Studna',d:'Čistá voda pro lidi i dobytek.',draw:dWell},
 tower:{n:'Hlásná věž',d:'Hlídka vidí nepřítele dřív než on tebe.',draw:dTower},
 market:{n:'Trh',d:'Jablka, chleba a ryby. Kupci si cestu najdou.',draw:dMarket},
 palisade:{n:'Palisáda',d:'Dřevěný plot proti vlkům i lupičům.',draw:dPalisade},
 forge:{n:'Kovárna',d:'Meče, podkovy a hřebíky ze žhavého železa.',draw:dForge},
 range:{n:'Lučiště',d:'Tady se cvičí střelci z celého kraje.',draw:dRange},
 keep:{n:'Kamenná věž',d:'Pevná věž s výhledem na celé království.',draw:dKeep},
 wall:{n:'Hradba',d:'Kamenné cimbuří, po kterém obchází stráž.',draw:dWall},
 gate:{n:'Hradní brána',d:'Za mřížemi začíná tvoje království.',draw:dGate},
 cathedral:{n:'Katedrála',d:'Vitráže, zvony a vysoká střela do nebe.',draw:dCathedral},
 alchemy:{n:'Alchymistická věž',d:'Nad střechou se vznáší zvláštní světlo.',draw:dAlchemy},
 barracks:{n:'Kasárna',d:'Štíty, kopí a rota připravená k boji.',draw:dBarracks},
 mill:{n:'Větrný mlýn',d:'Mele obilí z polí celého kraje.',draw:dMill},
 hall:{n:'Velká síň',d:'Srdce království. Tady se hoduje a rozhoduje.',draw:dHall}
};
const CHEER=['Jedním pokusem!','Skvěle!','Výborně!','Pěkně!','Uf, těsně!','Na poslední chvíli!'];

/* ---------- uložený stav ---------- */
function plotsOf(n,free){const a=Array(n).fill(null);a[0]=free;return a;}
function fresh(){return{v:1,won:0,daily:0,spent:0,level:0,unlocked:0,plots:[plotsOf(10,'fire'),plotsOf(12,'gate')],day:null,bonus:null};}
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.v===1&&Array.isArray(o.plots)&&o.plots.length===2)return o;}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
const filled=lv=>S.plots[lv].filter(Boolean).length;
const avail=()=>S.won-S.spent;
const sceneW=lv=>PAD*2+LEVELS[lv].plots*PW;
const ui={sel:null};

/* ---------- kreslení (pixel art) ---------- */
const canvasEl=$('scene'); let ctx=null;
let c=null, ox=0, gy=GY, T=0;
const U=(dx,top,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(ox+dx),Math.round(gy-top),Math.round(w),Math.round(h));};
function TRI(dx,base,w,hr,col,step,alt){for(let i=0;i<hr;i++){const ww=Math.round(w-2*i*step);if(ww<=0)break;U(dx+Math.round(i*step),base+i+1,ww,1,(alt&&i%3===0)?alt:col);}}
function bricks(dx,top,w,h,line){line=line||K.stoneD;for(let y=0;y<h;y+=5){U(dx,top-y,w,1,line);const off=((y/5)%2)*4;for(let x=dx+off;x<dx+w;x+=8)U(x,top-y,1,5,line);}}
function disc(cx,cy,r,col,al){c.globalAlpha=al==null?1:al;for(let dy=-r;dy<=r;dy++){const half=Math.floor(Math.sqrt(r*r-dy*dy));U(cx-half,cy+dy,half*2+1,1,col);}c.globalAlpha=1;}
function smoke(dx,top,col){for(let k=0;k<3;k++){const ph=(T*.5+k/3)%1;c.globalAlpha=.6*(1-ph);U(dx+Math.sin((T+k)*1.5)*2+ph*3,top+ph*16,2+ph*2,2+ph*2,col||'#e6e1d8');}c.globalAlpha=1;}
function flag(dx,top,w,h,col){for(let k=0;k<w;k++)U(dx+k,top+Math.round(Math.sin(T*4+k*.7)*1),1,h,col);}
function PERSON(x,y,col,dir,t,o){o=o||{};x=Math.round(x);y=Math.round(y);const st=Math.floor(t*6)%2;
  c.fillStyle='#2b2430';c.fillRect(x-1,y-3,1,st?3:2);c.fillRect(x+1,y-3,1,st?2:3);
  if(o.cape){c.fillStyle=K.purple;c.fillRect(x-dir*2,y-8,2,6);}
  c.fillStyle=col;c.fillRect(x-1,y-7,3,4);
  c.fillStyle=K.skin;c.fillRect(x-1,y-10,3,3);
  c.fillStyle=o.hair||'#4a3322';c.fillRect(x-1,y-10,3,1);
  c.fillStyle='#2a1d17';c.fillRect(x+(dir>0?1:-1),y-9,1,1);
  if(o.crown){c.fillStyle=K.gold;c.fillRect(x-1,y-12,3,2);c.fillRect(x-1,y-13,1,1);c.fillRect(x+1,y-13,1,1);}
  if(o.hat){c.fillStyle=o.hat;c.fillRect(x-2,y-11,5,1);c.fillRect(x-1,y-12,3,1);}
}

/* úroveň 1 */
function dHut(){
  U(38,36,5,22,K.stone);
  smoke(39,38);
  U(8,18,40,18,K.wood);
  for(let x=8;x<48;x+=4)U(x,18,1,18,K.woodD);
  TRI(3,18,50,23,K.thatch,1,K.thatchD);
  U(8,17,40,2,'rgba(0,0,0,.28)');
  U(23,12,9,12,K.door);U(24,13,7,1,K.door);
  U(13,15,7,7,K.woodD);U(14,14,5,5,K.glow);U(16,14,1,5,K.woodD);U(14,17,5,1,K.woodD);
}
function dField(){
  for(let i=0;i<16;i++){const x=3+i*3,h=9+((i*7)%4),sw=Math.round(Math.sin(T*2+i)*.7);
    U(x,h,2,h,i%2?K.wheat:K.wheatD);U(x+sw,h+3,2,3,'#f0cf6a');}
  U(27,27,2,27,K.woodD);U(21,22,14,2,K.woodD);
  U(25,28,6,6,'#7a8fb0');
  U(26,35,4,4,K.skin);U(24,37,8,2,K.woodD);U(26,40,4,3,K.woodD);
  U(27,33,1,1,K.dark);U(29,33,1,1,K.dark);
}
function dWell(){
  U(18,12,20,12,K.stone);

const PCOL=['#4f7c9e','#9e4f4f','#6a8f4a','#b0843a','#7a5aa0','#4a8f8f'];
let walkers=[];
function seedWalkers(){const lv=S.level,W=sceneW(lv),n=Math.min(7,1+Math.floor(filled(lv)/1.5));walkers=[];

function stepWalkers(dt){const W=sceneW(S.level);
  walkers.forEach(w=>{if(w.pause>0){w.pause-=dt;return;}
    w.x+=w.dir*w.sp*dt;
    if(w.x<PAD-8){w.x=PAD-8;w.dir=1;w.pause=1+Math.random()*2;}
    else if(w.x>W-PAD+8){w.x=W-PAD+8;w.dir=-1;w.pause=1+Math.random()*2;}

const ANIM={};
function drawScene(now){
  if(!ctx)return;
  const lv=S.level,L=LEVELS[lv],W=sceneW(lv),bg=getBG(lv),pal=PAL[lv];
  c=ctx;c.imageSmoothingEnabled=false;T=now;
  c.clearRect(0,0,W,H);
  c.drawImage(bg.sky,0,0);
  CLOUDS.forEach(cl=>cloud(((cl.x+T*cl.s)%(W+120))-60,cl.y,cl.w,pal.cloud,pal.cloudSh));
  c.drawImage(bg.back,0,0);
  const a=avail();
  for(let i=0;i<L.plots;i++){
    ox=PAD+i*PW;gy=GY;
    const id=S.plots[lv][i];
    if(id){
      const key=lv+':'+i,st=ANIM[key];
      if(st){
        const p=Math.min(1,(performance.now()-st)/700);
        if(p>=1){delete ANIM[key];BLD[id].draw();}
        else{const e=1-Math.pow(1-p,3);c.save();c.beginPath();c.rect(ox-4,0,PW+8,GY);c.clip();gy=GY+Math.round((1-e)*70);BLD[id].draw();c.restore();gy=GY;dust(p);}
      }else BLD[id].draw();
    }else marker(i,a);
  }
  ox=0;gy=GY;
  PERSON(12,GY+1,'#7a4cb8',1,0,{cape:true,crown:true,hair:'#d8b04a'});
  walkers.forEach(w=>PERSON(w.x,GY+1,w.col,w.dir,w.pause>0?0:T,{hat:w.hat}));

const T0=performance.now();let last=0;
function frame(now){
  if(!document.hidden&&now-last>=33){const dt=Math.min(.1,(now-last)/1000);last=now;stepWalkers(dt);drawScene((now-T0)/1000);}

const V=[],VI={};

const sim=(a,b)=>a.v.reduce((s,x,i)=>s+x*b.m[i],0)/(a.nr*b.nr);

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let busyAI=false;
const withTO=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('Časový limit '+ms/1000+' s, Firebase neodpověděl')),ms))]);
async function askAI(C,w){
  const P='Hra na hádání slov. Tajné slovo: "'+C.full+'". Hráčův tip: "'+w.slice(0,40)+'". Buď přísný: slova jen z podobného oboru dej 15-35, opravdu blízká 40-70, téměř synonyma 71-95. Odpověz POUZE JSON bez dalšího textu: {"real":true nebo false (je tip skutečné české slovo, i ohnuté),"score":0-100 (sémantická blízkost k tajnému slovu; 100 jen pro totéž slovo, běžná slova bez vztahu 0-15),"hint":"nejvýše 8 českých slov, vtipná středověká poznámka k SAMOTNÉMU tipu (ne k tajnému slovu); nesmí obsahovat tajné slovo, jeho synonyma ani žádnou informaci o něm"}';
  let t=null;
  window.lastAIError='';
  if(window.fbAsk){for(let a=0;a<2&&t==null;a++){try{t=await withTO(window.fbAsk(P),20000);}catch(err){console.warn('Firebase AI:',err);window.lastAIError='Firebase: '+(err&&err.message||err);if(a<1)await new Promise(r=>setTimeout(r,2500));}}}
  else window.lastAIError='Firebase AI se nenačetla'+(window.fbErr?' ('+window.fbErr+')':'')+'.';
  if(t==null){
    try{
      const res=await withTO(fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:P}]})}),8000);
      const d=await res.json();t=d.content.map(i=>i.text||'').join('');
    }catch(err){window.lastAIError=(window.lastAIError||'')+' | Claude API nedostupné.';return null;}
  }
  try{
    const o=JSON.parse((String(t).match(/\{[\s\S]*\}/)||[''])[0]);
    return{real:!!o.real,rank:Math.max(2,Math.round(Math.pow(1-Math.min(99,+o.score||0)/100,1.8)*V.length)),hint:String(o.hint||'').slice(0,80)};
  }catch(err){return null;}
}
async function submit(e){
  if(e)e.preventDefault();

  if(C.st.done||busyAI)return;

  if(!k)return;
  if(C.st.g.indexOf(k)>=0){setMsg('Tohle už jsi zkoušel.',1800);return;}
  if(!VI[k]){
    busyAI=true;setMsg('Královský písař listuje slovníkem…');
    const r=await askAI(C,raw);busyAI=false;
    if(cur!==C)return;
    if(!r){setMsg(/debug/.test(location.search)?'Důvod: '+String(window.lastAIError||'neznámý').slice(0,260):'Písař má právě plné ruce. Zkus to za chvilku nebo napiš jiné slovo.',6000);return;}
    if(!r.real){setMsg('Tohle není české slovo.',2400);return;}
    C.st.x=C.st.x||{};C.st.x[k]={w:raw.toLowerCase(),r:r.rank,h:r.hint};
  }
  C.st.g.push(k);gi.value='';setMsg('');

}

  h+='</div><p class="cd">Nové slovo dne za <b id="cd"></b></p>';
  resultEl.innerHTML=h;resultEl.hidden=false;
  const gb=$('goBuild');if(gb)gb.addEventListener('click',goBuild);
  const ge=$('goExtra');if(ge)ge.addEventListener('click',()=>{startBonus(false);});
  tick();
}
function goBuild(){
  let lv=S.level;
  if(S.plots[lv].indexOf(null)<0&&S.unlocked!==lv)lv=S.unlocked;
  if(lv!==S.level){S.level=lv;save();setupScene();}
  const idx=S.plots[lv].indexOf(null);
  ui.sel=idx>=0?idx:null;renderAll();
  if(idx>=0)focusPlot(idx);
  stageEl.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
function tick(){
  const t=todayInfo();
  if(S.day&&S.day.key!==t.key){startDaily();renderAll();return;}
  const n=new Date(),mid=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);
  const s=Math.max(0,Math.floor((mid-n)/1000)),el=$('cd');
  if(el)el.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(v=>String(v).padStart(2,'0')).join(':');
}

$('gf').addEventListener('submit',submit);

/* ---------- start ---------- */
startDaily();
if(S.day.done&&S.bonus&&!S.bonus.done)startBonus(true);
setupScene();
renderAll();
{const idx=S.plots[S.level].indexOf(null);focusPlot(idx>=0?idx:0);}
setInterval(tick,1000);
if(!reduce)requestAnimationFrame(frame);
})();
</script>
